name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  SOLUTION_FILE: 'Project Files/Source/Thetis_VS2026.sln'
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: x64
  # The checked-in .vcxproj/.sln files pin PlatformToolset v145 and a v17.0
  # VisualStudioVersion header (an unreleased VS toolset). windows-latest
  # ships VS2022 (toolset v143) -- force it on every msbuild invocation below.
  MSBUILD_TOOLSET_OVERRIDE: /p:PlatformToolset=v143 /p:VisualStudioVersion=17.0
  # ChannelMaster.vcxproj reads $(HPSDR_PLATFORM) -- an *environment* variable,
  # not an MSBuild property -- for several of its native-lib output/include
  # paths (e.g. ../../lib/NR_Algorithms_$(HPSDR_PLATFORM)). It is never set
  # anywhere in the repo, so it must come from the CI environment.
  HPSDR_PLATFORM: x64

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore "${{ env.SOLUTION_FILE }}"
        shell: pwsh

      # --- Native dependencies that ChannelMaster.vcxproj links against but
      # that are NOT projects in Thetis_VS2026.sln, so the solution build
      # won't build them itself. They must exist before ChannelMaster builds.

      - name: Stub missing opus_dnn arch-specific headers/sources
        # This vendored opus_dnn checkout is missing 65 files across
        # celt/{x86,arm}, silk/{x86,arm,fixed/x86,fixed/arm,float/x86}, and
        # dnn/{x86,arm} -- entire architecture-optimization subtrees were
        # never committed. silk_headers.mk/celt_headers.mk/lpcnet_headers.mk
        # list the x86/arm headers unconditionally (CMake's target_sources
        # needs them to physically exist even though the code paths that
        # would use them are disabled by OPUS_DISABLE_INTRINSICS below), and
        # the corresponding .c sources are listed too even though they won't
        # actually be added to the build. Create empty placeholders for all
        # of them so CMake configure doesn't fail on a missing file.
        run: |
          $missing = @(
            "celt/x86/celt_lpc_sse.h",
            "celt/arm/armcpu.h",
            "celt/arm/fixed_armv4.h",
            "celt/arm/fixed_armv5e.h",
            "celt/arm/fixed_arm64.h",
            "celt/arm/kiss_fft_armv4.h",
            "celt/arm/kiss_fft_armv5e.h",
            "celt/arm/mathops_arm.h",
            "celt/arm/pitch_arm.h",
            "celt/arm/fft_arm.h",
            "celt/arm/mdct_arm.h",
            "celt/x86/pitch_sse.h",
            "celt/x86/vq_sse.h",
            "celt/x86/x86_arch_macros.h",
            "celt/x86/x86cpu.h",
            "celt/x86/x86cpu.c",
            "celt/x86/x86_celt_map.c",
            "celt/x86/pitch_sse.c",
            "celt/x86/pitch_sse2.c",
            "celt/x86/vq_sse2.c",
            "celt/x86/celt_lpc_sse4_1.c",
            "celt/x86/pitch_sse4_1.c",
            "celt/x86/pitch_avx.c",
            "celt/arm/armcpu.c",
            "celt/arm/arm_celt_map.c",
            "celt/arm/celt_neon_intr.c",
            "celt/arm/pitch_neon_intr.c",
            "celt/arm/celt_fft_ne10.c",
            "celt/arm/celt_mdct_ne10.c",
            "dnn/x86/dnn_x86.h",
            "dnn/arm/dnn_arm.h",
            "dnn/x86/x86_dnn_map.c",
            "dnn/x86/nnet_avx2.c",
            "dnn/x86/nnet_sse4_1.c",
            "dnn/x86/nnet_sse2.c",
            "dnn/arm/arm_dnn_map.c",
            "dnn/arm/nnet_dotprod.c",
            "dnn/arm/nnet_neon.c",
            "silk/x86/main_sse.h",
            "silk/x86/SigProc_FIX_sse.h",
            "silk/arm/biquad_alt_arm.h",
            "silk/arm/LPC_inv_pred_gain_arm.h",
            "silk/arm/macros_armv4.h",
            "silk/arm/macros_armv5e.h",
            "silk/arm/macros_arm64.h",
            "silk/arm/SigProc_FIX_armv4.h",
            "silk/arm/SigProc_FIX_armv5e.h",
            "silk/arm/NSQ_del_dec_arm.h",
            "silk/arm/NSQ_neon.h",
            "silk/fixed/arm/warped_autocorrelation_FIX_arm.h",
            "silk/x86/x86_silk_map.c",
            "silk/x86/NSQ_sse4_1.c",
            "silk/x86/NSQ_del_dec_sse4_1.c",
            "silk/x86/VAD_sse4_1.c",
            "silk/x86/VQ_WMat_EC_sse4_1.c",
            "silk/x86/NSQ_del_dec_avx2.c",
            "silk/arm/arm_silk_map.c",
            "silk/arm/biquad_alt_neon_intr.c",
            "silk/arm/LPC_inv_pred_gain_neon_intr.c",
            "silk/arm/NSQ_del_dec_neon_intr.c",
            "silk/arm/NSQ_neon.c",
            "silk/fixed/x86/vector_ops_FIX_sse4_1.c",
            "silk/fixed/x86/burg_modified_FIX_sse4_1.c",
            "silk/fixed/arm/warped_autocorrelation_FIX_neon_intr.c",
            "silk/float/x86/inner_product_FLP_avx2.c"
          )
          foreach ($rel in $missing) {
            $path = Join-Path "Project Files/lib/opus_dnn" $rel
            $dir = Split-Path $path -Parent
            if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Force -Path $dir | Out-Null }
            if (-not (Test-Path $path)) { New-Item -ItemType File -Path $path | Out-Null }
          }
        shell: pwsh

      - name: Configure opus_dnn (CMake)
        # ASSUMPTION (unverified): OPUS_OSCE enables the FARGAN vocoder / LPCNet
        # feature extractor that radae_c links against, per README's mention of
        # "FARGAN vocoder (Opus DNN)". If the ChannelMaster build below fails on
        # unresolved LPCNet/FARGAN symbols, try -DOPUS_DRED=ON or -DOPUS_DEEP_PLC=ON
        # instead/also -- see Project Files/lib/opus_dnn/CMakeLists.txt around the
        # OPUS_DEEP_PLC/OPUS_DRED/OPUS_OSCE options.
        #
        # OPUS_DISABLE_INTRINSICS=ON is required, not optional: this vendored
        # opus_dnn checkout doesn't include the x86 SIMD source trees at all
        # (celt/x86, dnn/x86, silk/x86, silk/fixed/x86 are empty/absent), so
        # CMake's default x86-intrinsics detection fails with "Cannot find
        # source file: silk/x86/main_sse.h" the moment it's left enabled.
        run: |
          cmake -S "Project Files/lib/opus_dnn" -B "Project Files/lib/opus_dnn/build/${{ env.BUILD_PLATFORM }}" `
            -A ${{ env.BUILD_PLATFORM }} `
            -DOPUS_OSCE=ON -DOPUS_BUILD_TESTING=OFF -DOPUS_BUILD_PROGRAMS=OFF -DOPUS_BUILD_SHARED_LIBRARY=OFF `
            -DOPUS_DISABLE_INTRINSICS=ON
        shell: pwsh

      - name: Build opus_dnn
        run: cmake --build "Project Files/lib/opus_dnn/build/${{ env.BUILD_PLATFORM }}" --config ${{ env.BUILD_CONFIGURATION }} --target opus
        shell: pwsh

      - name: Build rnnoise
        run: >
          msbuild "Project Files/lib/rnnoise/build/rnnoise.vcxproj"
          /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform=${{ env.BUILD_PLATFORM }}
          ${{ env.MSBUILD_TOOLSET_OVERRIDE }} /m /v:minimal
        shell: pwsh

      - name: Build libebur128
        run: >
          msbuild "Project Files/lib/libebur128/build/libebur128.vcxproj"
          /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform=${{ env.BUILD_PLATFORM }}
          ${{ env.MSBUILD_TOOLSET_OVERRIDE }} /m /v:minimal
        shell: pwsh

      - name: Build WebRTC_AGC
        run: >
          msbuild "Project Files/lib/WebRTC_AGC/build/WebRTC_AGC.vcxproj"
          /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform=${{ env.BUILD_PLATFORM }}
          ${{ env.MSBUILD_TOOLSET_OVERRIDE }} /m /v:minimal
        shell: pwsh

      - name: Build radae_c
        # Needs opus_dnn's opus.lib already built (OpusDir defaults to ../../opus_dnn).
        run: >
          msbuild "Project Files/lib/radae_c/msvc/radae_c.vcxproj"
          /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform=${{ env.BUILD_PLATFORM }}
          ${{ env.MSBUILD_TOOLSET_OVERRIDE }} /m /v:minimal
        shell: pwsh

      # --- Main solution: portaudio, wdsp, cmASIO, ChannelMaster, Thetis,
      # Midi2Cat, RawInput. These ARE solution projects with dependency
      # ordering declared in the .sln, so one msbuild call handles them.
      # (The Thetis-Installer WiX project has no Build.0 entry for
      # Release|x64 in the .sln, so it's skipped automatically -- no WiX
      # toolset needed here.)

      - name: Build main solution
        run: >
          msbuild "${{ env.SOLUTION_FILE }}"
          /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform=${{ env.BUILD_PLATFORM }}
          ${{ env.MSBUILD_TOOLSET_OVERRIDE }} /m /v:minimal
        shell: pwsh

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: Thetis-RADE-${{ env.BUILD_PLATFORM }}-${{ env.BUILD_CONFIGURATION }}
          path: |
            Project Files/Source/bin/${{ env.BUILD_PLATFORM }}/${{ env.BUILD_CONFIGURATION }}/**
            Project Files/bin/${{ env.BUILD_PLATFORM }}/${{ env.BUILD_CONFIGURATION }}/**
          if-no-files-found: warn
